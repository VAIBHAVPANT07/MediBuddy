<body>
  <!-- React replaces this the moment it mounts. It exists so the first paint, and a crawler

  <div id="root">
    <main>
      <h1>Care that holds when the signal does not.</h1>
      <p>GramHealth is an offline-first rural healthcare platform for villages in Uttarakhand:

      <p><a href="/login">Sign in to a workspace</a></p>
