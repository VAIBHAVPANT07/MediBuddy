services:
  db:
    image: postgres:15.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medibuddy}
      POSTGRES_USER: ${POSTGRES_USER:-medibuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - medibuddy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medibuddy} -d ${POSTGRES_DB:-medibuddy}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-medibuddy}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-medibuddy}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-value-before-deployment}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-MediBuddy <onboarding@resend.dev>}
      SYNTHEA_DIR: /app/csv
      SYNTHEA_SEED: ${SYNTHEA_SEED:-2025}
      SYNTHEA_VILLAGES: ${SYNTHEA_VILLAGES:-Sample Village A|Dehradun;Sample Village B|Almora;Sample Village C|Chamoli;Sample Village D|Pauri Garhwal;Sample Village E|Uttarkashi}
    volumes:
      - ./csv:/app/csv:ro
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  medibuddy-postgres:
